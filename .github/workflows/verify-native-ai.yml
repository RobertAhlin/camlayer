name: Verify CamLayer Native AI Model (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/ai-probe/**'
      - '.github/workflows/verify-native-ai.yml'

permissions:
  contents: read

jobs:
  verify-onnx-inference:
    name: Windows x64 ONNX model inference
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout CamLayer
        uses: actions/checkout@v4

      - name: Download pinned ONNX Runtime and model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortVersion = '1.24.2'
          # Microsoft publishes this exact version as an official NuGet package.
          # Its native C++ headers and Windows x64 binaries are included.
          $ortPackage = "microsoft.ml.onnxruntime.$ortVersion.nupkg"
          $ortUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$ortVersion/$ortPackage"
          New-Item -ItemType Directory -Force -Path 'deps', 'models' | Out-Null
          Invoke-WebRequest -Uri $ortUrl -OutFile "deps/$ortPackage"
          Copy-Item "deps/$ortPackage" 'deps/onnxruntime.zip'
          Expand-Archive -Path 'deps/onnxruntime.zip' -DestinationPath 'deps/onnxruntime' -Force
          $required = @(
            'deps/onnxruntime/build/native/include/onnxruntime_cxx_api.h',
            'deps/onnxruntime/runtimes/win-x64/native/onnxruntime.lib',
            'deps/onnxruntime/runtimes/win-x64/native/onnxruntime.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "ONNX Runtime package missing $file" }
          }
          $modelUrl = 'https://huggingface.co/onnx-community/mediapipe_selfie_segmentation/resolve/d1eb4b9905988be58be2f6a3782e606ac9a3ca2f/onnx/model.onnx'
          Invoke-WebRequest -Uri $modelUrl -OutFile 'models/selfie_segmentation.onnx'
          $model = Get-Item 'models/selfie_segmentation.onnx'
          if ($model.Length -lt 100000) { throw 'Downloaded model unexpectedly small.' }
          $modelHash = (Get-FileHash -Algorithm SHA256 'models/selfie_segmentation.onnx').Hash.ToLowerInvariant()
          if ($modelHash -ne '3241ac4ad8aa35bdaf33946776db29f7c283a413aa0b0dacb9483594b4531aad') {
            throw "Model checksum mismatch: $modelHash"
          }
          Write-Host "Verified pinned model SHA256: $modelHash"
          Get-FileHash -Algorithm SHA256 "deps/$ortPackage" | Format-List

      - name: Compile native model probe (MSVC x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ort = 'deps/onnxruntime'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools not found.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $cmd = "`"$vcvars`" && cl /nologo /EHsc /std:c++17 /O2 /W4 /I`"$ort/build/native/include`" native/ai-probe/src/model-probe.cpp /link /LIBPATH:`"$ort/runtimes/win-x64/native`" onnxruntime.lib /OUT:camlayer-model-probe.exe"
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "C++ compilation failed: $LASTEXITCODE" }

      - name: Run model inference on synthetic image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = 'deps/onnxruntime/runtimes/win-x64/native'
          # Windows loads native dependencies most reliably beside the executable.
          Copy-Item "$native/onnxruntime.dll" './onnxruntime.dll' -Force
          Get-ChildItem "$native/*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination '.' -Force
          }
          $env:PATH = "$(Resolve-Path $native);$env:PATH"
          Write-Host 'Bundled native dependencies:'
          Get-ChildItem '*.dll' | Select-Object Name, Length | Format-Table -AutoSize
          & ./camlayer-model-probe.exe 'models/selfie_segmentation.onnx'
          $exitCode = $LASTEXITCODE
          Write-Host ("Model probe exit code: {0} (0x{1:X8})" -f $exitCode, ([uint32]([int64]$exitCode -band 0xffffffffL)))
          if ($exitCode -ne 0) { throw "Native ONNX model inference test failed with code $exitCode" }

      - name: Upload probe results (not an OBS plugin)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camlayer-native-model-probe-windows
          path: |
            camlayer-model-probe.exe
            native/ai-probe/README.md
          retention-days: 7

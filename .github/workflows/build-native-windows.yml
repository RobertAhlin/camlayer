name: Build CamLayer OBS plugin (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/obs-plugin/**'
      - '.github/workflows/build-native-windows.yml'

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 plugin bootstrap
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout CamLayer source
        uses: actions/checkout@v4
        with:
          path: camlayer

      - name: Checkout official OBS plugin template
        uses: actions/checkout@v4
        with:
          repository: obsproject/obs-plugintemplate
          ref: master
          path: obs-template
          submodules: recursive

      - name: Acquire pinned native AI dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.24.2'
          $package = "microsoft.ml.onnxruntime.$version.nupkg"
          $url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/$version/$package"
          New-Item -ItemType Directory -Force -Path 'deps' | Out-Null
          Invoke-WebRequest -Uri $url -OutFile "deps/$package"
          Copy-Item "deps/$package" 'deps/ort.zip'
          Expand-Archive 'deps/ort.zip' 'deps/ort' -Force
          $ortHeader = 'deps/ort/build/native/include/onnxruntime_cxx_api.h'
          $ortLib = 'deps/ort/runtimes/win-x64/native/onnxruntime.lib'
          $ortDll = 'deps/ort/runtimes/win-x64/native/onnxruntime.dll'
          foreach ($file in @($ortHeader, $ortLib, $ortDll)) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing native dependency: $file" }
          }

          $modelUrl = 'https://huggingface.co/onnx-community/mediapipe_selfie_segmentation/resolve/d1eb4b9905988be58be2f6a3782e606ac9a3ca2f/onnx/model.onnx'
          Invoke-WebRequest -Uri $modelUrl -OutFile 'deps/selfie_segmentation.onnx'
          $actual = (Get-FileHash -Algorithm SHA256 'deps/selfie_segmentation.onnx').Hash.ToLowerInvariant()
          $expected = '3241ac4ad8aa35bdaf33946776db29f7c283a413aa0b0dacb9483594b4531aad'
          if ($actual -ne $expected) { throw "Model SHA256 mismatch: $actual" }
          Write-Host "Pinned native AI dependencies verified (model $actual)."

          # Official RVM MobileNetV3 FP32 ONNX model (GPL-3.0 project).
          $rvmUrl = 'https://github.com/PeterL1n/RobustVideoMatting/releases/download/v1.0.0/rvm_mobilenetv3_fp32.onnx'
          Invoke-WebRequest -Uri $rvmUrl -OutFile 'deps/rvm_mobilenetv3_fp32.onnx'
          $rvmFile = Get-Item 'deps/rvm_mobilenetv3_fp32.onnx'
          if ($rvmFile.Length -lt 1000000) { throw 'RVM download unexpectedly small.' }
          $rvmHash = (Get-FileHash -Algorithm SHA256 $rvmFile.FullName).Hash.ToLowerInvariant()
          $rvmExpected = '88d4531297118f595bf2fd60f6f566aec2e559393802d1f436c380f0cbbd2828'
          if ($rvmHash -ne $rvmExpected) { throw "RVM model SHA256 mismatch: $rvmHash" }
          Write-Host "Official RVM FP32 model verified; SHA256: $rvmHash"

      - name: Adapt official template for CamLayer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'camlayer/native/obs-plugin/src/plugin-main.c' 'obs-template/src/plugin-main.c' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/ai-engine.cpp' 'obs-template/src/ai-engine.cpp' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/ai-engine.h' 'obs-template/src/ai-engine.h' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/ai-worker.cpp' 'obs-template/src/ai-worker.cpp' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/ai-worker.h' 'obs-template/src/ai-worker.h' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/rvm-alpha-feather.h' 'obs-template/src/rvm-alpha-feather.h' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/rvm-engine.cpp' 'obs-template/src/rvm-engine.cpp' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/rvm-engine.h' 'obs-template/src/rvm-engine.h' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/ai-mask-refine.h' 'obs-template/src/ai-mask-refine.h' -Force
          Copy-Item 'camlayer/native/obs-plugin/src/ai-mask-refine.cpp' 'obs-template/src/ai-mask-refine.cpp' -Force
          New-Item -ItemType Directory -Force -Path 'obs-template/data/models' | Out-Null
          Copy-Item 'deps/selfie_segmentation.onnx' 'obs-template/data/models/selfie_segmentation.onnx' -Force
          Copy-Item 'deps/rvm_mobilenetv3_fp32.onnx' 'obs-template/data/models/rvm_mobilenetv3_fp32.onnx' -Force
          New-Item -ItemType Directory -Force -Path 'obs-template/dependencies/onnxruntime/include' | Out-Null
          Copy-Item 'deps/ort/build/native/include/*.h' 'obs-template/dependencies/onnxruntime/include/' -Force
          Copy-Item 'deps/ort/runtimes/win-x64/native/onnxruntime.lib' 'obs-template/dependencies/onnxruntime/onnxruntime.lib' -Force
          $cmake = 'obs-template/CMakeLists.txt'
          Add-Content $cmake @'
          target_sources(${CMAKE_PROJECT_NAME} PRIVATE src/ai-engine.cpp src/ai-worker.cpp src/ai-mask-refine.cpp src/rvm-engine.cpp)
          target_compile_features(${CMAKE_PROJECT_NAME} PRIVATE cxx_std_17)
          if(MSVC)
            target_compile_options(${CMAKE_PROJECT_NAME} PRIVATE $<$<COMPILE_LANGUAGE:CXX>:/EHsc>)
          endif()
          target_include_directories(${CMAKE_PROJECT_NAME} PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/dependencies/onnxruntime/include")
          target_link_libraries(${CMAKE_PROJECT_NAME} PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/dependencies/onnxruntime/onnxruntime.lib")
          '@
          New-Item -ItemType Directory -Force -Path 'obs-template/data/locale' | Out-Null
          Copy-Item 'camlayer/native/obs-plugin/data/locale/en-US.ini' 'obs-template/data/locale/en-US.ini' -Force
          Copy-Item 'camlayer/native/obs-plugin/data/ellipse_alpha.effect' 'obs-template/data/ellipse_alpha.effect' -Force

          $specFile = 'obs-template/buildspec.json'
          $spec = Get-Content $specFile -Raw | ConvertFrom-Json
          $spec.name = 'camlayer-obs'
          $spec.displayName = 'CamLayer OBS Plugin'
          $spec.version = '0.2.0'
          $spec.author = 'CamLayer contributors'
          $spec.website = 'https://github.com/RobertAhlin/camlayer'
          $spec.email = ''
          $spec | ConvertTo-Json -Depth 20 | Set-Content -Path $specFile -Encoding utf8

          Write-Host 'OBS plugin template prepared with native ONNX Runtime (experimental loader only).'

      - name: Configure, build and install using OBS template
        working-directory: obs-template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: Package native ONNX Runtime next to CamLayer DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'obs-template/release/RelWithDebInfo/camlayer-obs/bin/64bit'
          if (-not (Test-Path "$dest/camlayer-obs.dll")) { throw 'OBS DLL missing.' }
          Copy-Item 'deps/ort/runtimes/win-x64/native/onnxruntime.dll' "$dest/onnxruntime.dll" -Force
          $model = 'obs-template/release/RelWithDebInfo/camlayer-obs/data/models/selfie_segmentation.onnx'
          if (-not (Test-Path $model)) { throw 'Model is missing from artifact.' }
          $rvmModel = 'obs-template/release/RelWithDebInfo/camlayer-obs/data/models/rvm_mobilenetv3_fp32.onnx'
          if (-not (Test-Path $rvmModel)) { throw 'RVM model missing from artifact.' }
          Write-Host 'Bundled ONNX Runtime DLL, MediaPipe and RVM FP32 models.'

      - name: Smoke-test OBS-linked ONNX engine with synthetic BGRA frame
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw 'Visual Studio build tools unavailable.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $cmd = "`"$vcvars`" && cl /nologo /EHsc /std:c++17 /O2 /I`"deps/ort/build/native/include`" camlayer/native/obs-plugin/src/ai-engine.cpp camlayer/native/obs-plugin/src/ai-worker.cpp camlayer/native/obs-plugin/src/ai-mask-refine.cpp camlayer/native/obs-plugin/src/rvm-engine.cpp camlayer/native/obs-plugin/tests/native-engine-smoke.cpp /link /LIBPATH:`"deps/ort/runtimes/win-x64/native`" onnxruntime.lib /OUT:camlayer-native-smoke.exe"
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "Smoke test compilation failed: $LASTEXITCODE" }
          Copy-Item 'deps/ort/runtimes/win-x64/native/onnxruntime.dll' './onnxruntime.dll' -Force
          & ./camlayer-native-smoke.exe 'deps/selfie_segmentation.onnx'
          if ($LASTEXITCODE -ne 0) { throw "ONNX engine smoke test failed: $LASTEXITCODE" }

      - name: Smoke-test continuous RVM Gaussian feather
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw 'Visual Studio build tools unavailable.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $cmd = "`"$vcvars`" && cl /nologo /EHsc /std:c++17 /O2 camlayer/native/obs-plugin/tests/rvm-alpha-feather-smoke.cpp /Fe:camlayer-rvm-feather-smoke.exe"
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "RVM feather test compile failed: $LASTEXITCODE" }
          & ./camlayer-rvm-feather-smoke.exe
          if ($LASTEXITCODE -ne 0) { throw "RVM feather test failed: $LASTEXITCODE" }

      - name: Smoke-test RVM model and recurrent state with synthetic frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $cmd = "`"$vcvars`" && cl /nologo /EHsc /std:c++17 /O2 /I`"deps/ort/build/native/include`" camlayer/native/obs-plugin/src/rvm-engine.cpp camlayer/native/obs-plugin/tests/rvm-engine-smoke.cpp /link /LIBPATH:`"deps/ort/runtimes/win-x64/native`" onnxruntime.lib /OUT:camlayer-rvm-smoke.exe"
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "RVM smoke build failed: $LASTEXITCODE" }
          & ./camlayer-rvm-smoke.exe 'deps/rvm_mobilenetv3_fp32.onnx'
          if ($LASTEXITCODE -ne 0) { throw "RVM recurrent inference test failed: $LASTEXITCODE" }

      - name: Show built files
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem 'obs-template/release/RelWithDebInfo' -Recurse -File |
            Select-Object FullName, Length | Format-Table -AutoSize

      - name: Verify plugin binary and shader are packaged
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'obs-template/release/RelWithDebInfo/camlayer-obs'
          $required = @(
            "$root/bin/64bit/camlayer-obs.dll",
            "$root/data/ellipse_alpha.effect",
            "$root/data/locale/en-US.ini",
            "$root/bin/64bit/onnxruntime.dll",
            "$root/data/models/selfie_segmentation.onnx",
            "$root/data/models/rvm_mobilenetv3_fp32.onnx"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Required artifact file missing: $path"
            }
            Write-Host "Verified: $path"
          }

      - name: Upload Windows test plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: camlayer-obs-windows-x64-bootstrap
          path: obs-template/release/RelWithDebInfo/
          if-no-files-found: error
          retention-days: 14

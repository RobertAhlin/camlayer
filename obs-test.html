<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CamLayer OBS Transparency Test</title>
  <style>
    html,body{margin:0;background:transparent!important;overflow:hidden;width:100%;height:100%}
    *{box-sizing:border-box}
    .test{position:absolute;left:4%;bottom:8%;padding:26px 32px;border-radius:20px;background:rgba(10,25,51,.85);color:white;font:700 clamp(22px,4vw,44px) system-ui,sans-serif;box-shadow:0 10px 25px #0004}
    .test small{font:400 16px system-ui,sans-serif;display:block;margin-top:10px;color:#bde8ec}
    .disc{position:absolute;top:10%;right:10%;width:15vmin;height:15vmin;border-radius:50%;background:#50d6d3;box-shadow:0 0 0 6px #64abf766}
    .line{position:absolute;left:0;top:0;height:8px;width:100%;background:linear-gradient(90deg,#83a7ff,transparent)}
  </style>
</head>
<body>
  <div class="line"></div><div class="disc"></div>
  <div class="test">CamLayer OBS Transparency Test
    <small>The area outside these shapes must be transparent.</small>
  </div>
</body>
</html>

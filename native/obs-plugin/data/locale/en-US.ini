CamLayer.BootstrapNotice="Live MediaPipe is experimental: enable it to test real person masking. Threshold shapes the mask. Signed softness moves and feathers the edge. Edge feather width adds smoothing. Edge detail uses the full-resolution camera image to guide mask upscaling, aiming for narrower and less blocky edges. Higher detail may reveal noise or halos. Cleanup and stability refine the mask over time. Cleanup attenuates isolated edge artifacts; stability reduces flicker. Edge follow speed controls motion response and requests more frequent mask updates (10 to 60 Hz). Actual speed depends on the CPU. Disable live AI to use pass-through or the verified ellipse diagnostic."


CamLayer.BootstrapNotice="MediaPipe and RVM settings are independent. RVM Feather v2 uses a 256x256 signed-distance matte: softness 0 disables feather, width sets the base band in mask pixels, and inner share allocates the fade inward versus outward. Effective band width = width x (1 + 0.6 x softness). Try softness 2.5, width 8, inner share 0.75. The continuous edge fade has zero slope at both ends. RVM still operates on a 256x256 mask, so very fine hair detail can remain limited. Excessive settings can make large translucent silhouettes."


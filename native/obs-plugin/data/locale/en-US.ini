CamLayer.BootstrapNotice="RVM Feather v3 filters the continuous alpha matte with a true separable Gaussian instead of constructing a binary SDF edge. Softness 0 disables feather. Width sets the base Gaussian spread in 256x256 mask pixels, softness increases sigma, and bias adjusts the fade inward or outward smoothly without a hard boundary. Start with softness 1.5, width 3.0, bias 0.5. MediaPipe remains unchanged. Heavy feather may remove fine hair detail; try smaller width if the image looks hazy."


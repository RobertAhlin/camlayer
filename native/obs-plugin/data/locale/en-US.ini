CamLayer.BootstrapNotice="RVM starts with alpha black and white points plus an independent mask resolution option (256, 384 or 512). Higher mask resolutions run the ONNX model at that size and upload native alpha to the GPU, requiring more CPU and memory. Start with 256 and compare 384 and 512 at the same camera lighting. Enable edge handling to reveal cleanup, stabilization, capture follow speed, Gaussian softness, width and bias. When disabled, edge effects are bypassed but their saved values remain available if you enable them again. MediaPipe controls are unchanged."


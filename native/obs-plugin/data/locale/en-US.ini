CamLayer.BootstrapNotice="RVM Feather v3 preserves continuous alpha. RVM extended ranges: cleanup 0-2, stability 0-4, capture follow 0-10 and Gaussian softness 0-10. Softness 0 bypasses blur. Width remains 0-20 mask pixels and bias 0-1. Very high stability can cause lag; high cleanup or softness may erase hair detail. Capture requests stay capped at 60 Hz; higher follow does not increase camera FPS (often 30 FPS), but changes motion-adaptive stabilization. MediaPipe ranges are unchanged."

